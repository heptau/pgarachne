services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Empty host port -> Docker picks a random free one, so this never
      # collides with another project's Postgres container (e.g. one bound
      # to a fixed port on the same machine). run_tests.sh reads back the
      # assigned port via `docker compose port`.
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
