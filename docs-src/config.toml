baseURL = "https://www.pgarachne.com/"
title = "PgArachne"
publishDir = "../docs"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
relativeURLs = true

# Hugo >= 0.145 ships a default-deny policy for page content types. The
# PgArachne docs use raw HTML files (custom markup, embedded iframes for
# the explorer demo, hardcoded <br> tags inside i18n strings) and a small
# amount of markdown for release notes. We override the default-deny list
# with explicit allow patterns for those MIME types.
[security]
  enableInlineShortcodes = true
  allowContent = ['^text/html$', '^text/markdown$', '^text/plain$']
  [security.exec]
    allow = ['^dart-sass-embedded$', '^dart-sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
    osEnv = ['(?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\w+|(XDG_CONFIG_)?HOME|USERPROFILE|SSH_AUTH_SOCK|DISPLAY|LANG|SYSTEMDRIVE|PROGRAMDATA)$']

[minify]
  minifyOutput = true

[taxonomies]

[params]
  description = "PgArachne: High-performance PostgreSQL JSON-RPC gateway with SSE real-time updates and Prometheus metrics."
  ogDescription = "Turn PostgreSQL into a secure API instantly. JSON-RPC gateway with SSE real-time updates and Prometheus metrics."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[languages]
  [languages.en]
    label = "English"
    weight = 1
    contentDir = "content/en"
  [languages.cs]
    label = "Čeština"
    weight = 2
    contentDir = "content/cs"
  [languages.es]
    label = "Español"
    weight = 3
    contentDir = "content/es"
  [languages.de]
    label = "Deutsch"
    weight = 4
    contentDir = "content/de"
  [languages.fr]
    label = "Français"
    weight = 5
    contentDir = "content/fr"
  [languages.it]
    label = "Italiano"
    weight = 6
    contentDir = "content/it"
  [languages.pt]
    label = "Português"
    weight = 7
    contentDir = "content/pt"
