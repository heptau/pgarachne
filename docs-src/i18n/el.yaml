- id: hero_lead
  translation: "Η βάση δεδομένων σας είναι το backend σας.<br>Χωρίς boilerplate. Ασφαλές, άμεσο, έτοιμο για AI."
- id: hero_desc
  translation: "Ορίστε μια συνάρτηση SQL — το endpoint του API σας είναι έτοιμο. JSON-RPC&nbsp;2.0 με εγγενή υποστήριξη MCP για Claude Desktop &amp; Cursor, ειδοποιήσεις SSE σε πραγματικό χρόνο και ασφάλεια ενσωματωμένη στη βάση δεδομένων. Έτοιμο για παραγωγική χρήση, ένα μόνο εκτελέσιμο αρχείο."
