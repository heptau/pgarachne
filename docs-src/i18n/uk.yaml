  translation: "Визначте SQL-функцію — і ваш API-ендпоінт готовий. JSON-RPC&nbsp;2.0 із вбудованою підтримкою MCP для Claude Desktop &amp; Cursor, сповіщення SSE в реальному часі та безпека на рівні бази даних. Промислова якість, єдиний бінарний файл."
