# golangci-lint configuration (v2 format; requires golangci-lint v2.x).
# Run locally with: make lint
version: "2"
linters:
  enable:
    - copyloopvar
    - gosec
    - misspell
    - unconvert
    - unparam
  exclusions:
    generated: lax
    presets:
      # "legacy" is deliberately excluded: it silently drops gosec G301/G302/
      # G307 (world-readable file/dir permission) findings, which conflicts
      # with this project's secure-by-default posture. Fix the permissions
      # instead of relying on the preset to hide the finding.
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
