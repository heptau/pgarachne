openapi: 3.0.3
info:
  title: PgArachne JSON-RPC Gateway
  description: >
    A JSON-RPC 2.0 API gateway that maps JSON-RPC methods to PostgreSQL functions.


    **Core Concept**: The path `/api/{database}` is used for all calls, and the JSON-RPC `method`
    contains the target function name (for example `api.list_users`).
  version: 1.0.3
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /api/{database}:
    post:
      summary: Execute a JSON-RPC method
      description: >
        Executes a PostgreSQL function via JSON-RPC. The JSON-RPC `method` should be the
        fully-qualified function name (e.g., `api.list_users`). The special method
        `login` authenticates a user and returns a JWT in the `result.token` field.
      operationId: executeMethod
      parameters:
        - name: database
          in: path
          description: Target database name
          required: true
          schema:
            type: string
            example: pgarachne_demo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: JSON-RPC Response (Success or Error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '400':
          description: Invalid JSON-RPC request
        '401':
          description: Unauthorized (Missing or invalid token)
        '500':
          description: Internal Server Error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Format: `Token <your_api_token>`"

  schemas:
    JsonRpcRequest:
      type: object
      required:
        - jsonrpc
        - method
        - id
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
          example: "2.0"
        method:
          type: string
          description: "Must match the function name in the URL"
          example: "list_users"
        params:
          type: object
          description: "Parameters passed to the SQL function as a JSON object"
          example: {"limit": 10}
        id:
          type: integer # or string
          example: 1

    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          example: "2.0"
        result:
          type: object # or any type
          description: "Successful result from the function"
        error:
          $ref: '#/components/schemas/JsonRpcError'
        id:
          type: integer # or string
          example: 1

    JsonRpcError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: -32600
        message:
          type: string
          example: "Invalid Request"
        data:
          type: object

security:
  - BearerAuth: []
  - ApiKeyAuth: []
