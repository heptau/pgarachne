name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Floating minor version (not an exact patch pin): setup-go always
          # resolves this to the latest 1.25.x release, so we automatically
          # pick up upstream stdlib security fixes instead of being stuck on
          # whatever patch was current when this line was last edited.
          go-version: '1.25'
          cache: true

      - name: Show Go toolchain info
        run: |
          go version
          go env GOTOOLCHAIN

      - name: Verify build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          if [ "$(gofmt -l . | wc -l)" -ne 0 ]; then
            echo "Files with gofmt issues:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2 (config format is v2 — see .golangci.yml).
          # Must be built with a Go version >= the go.mod `go` directive (1.25.0),
          # otherwise golangci-lint refuses to run ("Go language version ... is
          # lower than the targeted Go version").
          version: v2.12.2

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run unit tests
        run: |
          go test -race -count=1 ./internal/auth ./internal/config ./internal/daemon ./internal/version

      - name: Run integration tests
        # Also writes coverage.out — see scripts/run_tests.sh for why this
        # can't be a separate step after the Postgres container is torn down.
        env:
          PGARACHNE_TEST_DB: '1'
        run: bash scripts/run_tests.sh

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        # CODECOV_TOKEN is configured in repository secrets. If the secret
        # is missing, the step is skipped so the workflow still passes.
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
          verbose: false
