<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PgArachne browser demo</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  fieldset { margin: 1rem 0; } label { display: block; margin: .4rem 0; }
  input { padding: .3rem; } button { padding: .4rem .8rem; }
  pre { background: #f3f3f3; padding: .6rem; overflow: auto; min-height: 2.5rem; }
</style>
</head>
<body>
<h1>PgArachne browser demo</h1>

<fieldset>
  <legend>Connection (HTTP Basic = PostgreSQL user and password)</legend>
  <label>Database <input id="db" value="my_database"></label>
  <label>User <input id="user" value="webuser"></label>
  <label>Password <input id="pass" type="password" value="webuser_password"></label>
</fieldset>

<fieldset>
  <legend>1. JSON-RPC</legend>
  <label>Name <input id="name" value="Alice"></label>
  <button id="rpcBtn">Call api.greet</button>
  <pre id="rpcOut"></pre>
</fieldset>

<fieldset>
  <legend>2. SSE (real-time)</legend>
  <button id="listenBtn">Start listening</button>
  <button id="stopBtn" disabled>Stop</button>
  <label>Message <input id="text" value="Hello from the browser"> <button id="sendBtn">Send</button></label>
  <pre id="sseOut"></pre>
</fieldset>

<fieldset>
  <legend>3. File download</legend>
  <button id="fileBtn">Download report.csv</button>
  <pre id="fileOut"></pre>
</fieldset>

<script>
// ---- helpers -------------------------------------------------------------
const $ = (id) => document.getElementById(id);

// Basic auth header. TextEncoder makes non-ASCII passwords work (btoa alone would not).
function authHeader() {
  const bytes = new TextEncoder().encode($("user").value + ":" + $("pass").value);
  return "Basic " + btoa(String.fromCharCode(...bytes));
}
const base = () => location.origin + "/db/" + encodeURIComponent($("db").value);

// PgArachne reports errors as JSON: {"error": {"message": "..."}} (JSON-RPC)
// or {"error": "..."} (SSE).
async function errorMessage(res) {
  try {
    const body = await res.json();
    return (body.error && body.error.message) || body.error || res.statusText;
  } catch { return res.statusText; }
}

// ---- 1. JSON-RPC ---------------------------------------------------------
async function rpc(method, params) {
  const res = await fetch(base() + "/jsonrpc", {
    method: "POST",
    headers: { "Authorization": authHeader(), "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", method, params, id: 1 }),
  });
  const body = await res.json();
  if (!res.ok || body.error) throw new Error((body.error && body.error.message) || res.statusText);
  return body.result;
}

$("rpcBtn").onclick = async () => {
  try { $("rpcOut").textContent = JSON.stringify(await rpc("api.greet", { name: $("name").value }), null, 2); }
  catch (e) { $("rpcOut").textContent = "Error: " + e.message; }
};

// ---- 2. SSE --------------------------------------------------------------
// EventSource cannot send an Authorization header, so we read the stream with fetch().
let abort = null;

async function listen(channels, onMessage, signal) {
  const res = await fetch(base() + "/sse?channels=" + encodeURIComponent(channels), {
    headers: { "Authorization": authHeader() }, signal,
  });
  if (!res.ok) throw new Error(await errorMessage(res));
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let end;
    while ((end = buffer.indexOf("\n\n")) >= 0) {       // one SSE event ends with a blank line
      const event = buffer.slice(0, end);
      buffer = buffer.slice(end + 2);
      for (const line of event.split("\n")) {
        if (line.startsWith("data: ")) onMessage(JSON.parse(line.slice(6)));  // lines starting with ":" are heartbeats
      }
    }
  }
}

$("listenBtn").onclick = async () => {
  abort = new AbortController();
  $("listenBtn").disabled = true; $("stopBtn").disabled = false;
  $("sseOut").textContent = "Connecting…\n";
  try {
    await listen("demo", (m) => { $("sseOut").textContent += JSON.stringify(m) + "\n"; }, abort.signal);
  } catch (e) {
    if (e.name !== "AbortError") $("sseOut").textContent += "Error: " + e.message + "\n";
  }
  $("listenBtn").disabled = false; $("stopBtn").disabled = true;
};
$("stopBtn").onclick = () => abort && abort.abort();
$("sendBtn").onclick = async () => {
  try { await rpc("api.send_message", { text: $("text").value }); }
  catch (e) { $("sseOut").textContent += "Error: " + e.message + "\n"; }
};

// ---- 3. File download ----------------------------------------------------
$("fileBtn").onclick = async () => {
  try {
    const res = await fetch(base() + "/file", {
      method: "POST",
      headers: { "Authorization": authHeader(), "Content-Type": "application/json" },
      body: JSON.stringify({ method: "api.export_report", params: {}, options: { filename: "report.csv" } }),
    });
    if (!res.ok) throw new Error(await errorMessage(res));   // errors are JSON, never binary
    const url = URL.createObjectURL(await res.blob());
    const a = Object.assign(document.createElement("a"), { href: url, download: "report.csv" });
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    $("fileOut").textContent = "Downloaded report.csv";
  } catch (e) { $("fileOut").textContent = "Error: " + e.message; }
};
</script>
</body>
</html>
